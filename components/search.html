<section
    class="search-section"
    id="home"
>

    <!-- =====================================
         WELCOME
         ===================================== -->

    <div class="welcome-text">

        <p>
            Discover the weather around you
        </p>

        <h1>
            How's the weather today?
        </h1>

    </div>


    <!-- =====================================
         SEARCH AREA
         ===================================== -->

    <div class="search-container">


        <!-- Search Box -->

        <div class="search-box">

            <i
                class="fa-solid fa-location-dot"
            ></i>


            <input
                type="text"
                id="cityInput"
                placeholder="Search city, town, village or PIN code..."
                autocomplete="off"
            />


            <button
                id="searchBtn"
                type="button"
            >
                Search
            </button>

        </div>


        <!-- =================================
             LOCATION BUTTON
             ================================= -->

        <button
            class="location-btn"
            id="locationBtn"
            type="button"
        >

            <i
                class="fa-solid fa-location-crosshairs"
            ></i>

            <span>
                Use My Location
            </span>

        </button>

    </div>


    <!-- =====================================
         ERROR MESSAGE
         ===================================== -->

    <p
        class="search-error"
        id="searchError"
    ></p>

</section>
