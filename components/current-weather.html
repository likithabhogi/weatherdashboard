<section class="current-weather">

    <!-- Location -->
    <div class="location-info">

        <div class="current-location">

            <i class="fa-solid fa-location-dot"></i>

            <span id="locationName">
                Visakhapatnam, India
            </span>

        </div>


        <p id="currentDate">
            Monday, August 25, 2026
        </p>

    </div>


    <!-- Main Weather -->
    <div class="weather-main">

        <!-- Weather Icon -->
        <div class="weather-icon-container">

            <img
                id="weatherIcon"
                class="weather-icon"
                src="assets/icons/01-sun.png"
                alt="Sunny weather"
            >

        </div>


        <!-- Temperature -->
        <div class="temperature-container">

            <h2>

                <span id="temperature">
                    28
                </span>

                <sup>°C</sup>

            </h2>


            <h3 id="weatherCondition">
                Mostly Sunny
            </h3>


            <p>
                Feels like

                <strong>

                    <span id="feelsLike">
                        30
                    </span>

                    °C

                </strong>

            </p>

        </div>

    </div>


    <!-- Weather Message -->
    <div
        class="weather-message"
        id="weatherMessage"
    >

        <i class="fa-solid fa-sun"></i>

        <span>
            It's a beautiful day!
            Perfect for outdoor activities.
        </span>

    </div>

</section>
