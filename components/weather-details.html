<section
    class="details-section"
    id="details"
>

    <!-- Section Heading -->
    <div class="section-title">

        <h2>
            Today's Weather
        </h2>

        <p>
            Everything you need to know
        </p>

    </div>


    <!-- Weather Cards -->
    <div class="details-grid">


        <!-- Humidity -->
        <div class="weather-card">

            <div class="card-icon humidity-icon">

                <i class="fa-solid fa-droplet"></i>

            </div>

            <div>

                <p>
                    Humidity
                </p>

                <h3>

                    <span id="humidity">
                        68
                    </span>%

                </h3>

            </div>

        </div>


        <!-- Wind -->
        <div class="weather-card">

            <div class="card-icon wind-icon">

                <i class="fa-solid fa-wind"></i>

            </div>

            <div>

                <p>
                    Wind Speed
                </p>

                <h3>

                    <span id="windSpeed">
                        14
                    </span>

                    km/h

                </h3>

            </div>

        </div>


        <!-- Rain -->
        <div class="weather-card">

            <div class="card-icon rain-icon">

                <i class="fa-solid fa-cloud-rain"></i>

            </div>

            <div>

                <p>
                    Chance of Rain
                </p>

                <h3>

                    <span id="rainChance">
                        10
                    </span>%

                </h3>

            </div>

        </div>


        <!-- Visibility -->
        <div class="weather-card">

            <div class="card-icon visibility-icon">

                <i class="fa-solid fa-eye"></i>

            </div>

            <div>

                <p>
                    Visibility
                </p>

                <h3>

                    <span id="visibility">
                        8
                    </span>

                    km

                </h3>

            </div>

        </div>


        <!-- Pressure -->
        <div class="weather-card">

            <div class="card-icon pressure-icon">

                <i class="fa-solid fa-gauge-high"></i>

            </div>

            <div>

                <p>
                    Pressure
                </p>

                <h3>

                    <span id="pressure">
                        1012
                    </span>

                    hPa

                </h3>

            </div>

        </div>


        <!-- UV Index -->
        <div class="weather-card">

            <div class="card-icon uv-icon">

                <i class="fa-solid fa-sun"></i>

            </div>

            <div>

                <p>
                    UV Index
                </p>

                <h3>

                    <span id="uvIndex">
                        5
                    </span>

                    <small>
                        Moderate
                    </small>

                </h3>

            </div>

        </div>


    </div>

</section>
